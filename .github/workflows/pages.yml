name: pages

# Publishes web/ as the public demo.
#
# ONE MANUAL STEP IS REQUIRED FIRST, and it can only be done in the browser:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# Until that is set, this workflow fails on the configure-pages step. Everything
# else is automatic; the demo URL is then https://phazon2.github.io/rescind/.
#
# The published page is self-contained: scripts/record_demo.py writes web/data.js
# alongside web/data.json, and the page loads the script rather than fetching, so
# it renders with no CORS dependency and works from disk too.

on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the demo has recorded data
        run: |
          set -euo pipefail
          test -f web/index.html || { echo "web/index.html missing"; exit 1; }
          if [ ! -f web/data.js ]; then
            echo "web/data.js missing -- the verify workflow generates it via"
            echo "scripts/record_demo.py. Run verify first."
            exit 1
          fi
          python -c "
import json, pathlib
raw = pathlib.Path('web/data.js').read_text()
payload = json.loads(raw.split('=', 1)[1].rstrip().rstrip(';'))
assert payload['before']['decision']['verdict'] == 'release'
assert payload['after']['decision']['verdict'] == 'refused'
print('demo data intact:',
      payload['retraction']['facts_retracted'], 'facts retracted,',
      payload['retraction']['decisions_flagged'], 'decision flagged')
"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
