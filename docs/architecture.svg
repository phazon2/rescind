<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 700" width="1020" height="700" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Explicit background: GitHub renders this on both light and dark themes. -->
  <rect width="1020" height="700" fill="#faf9f6"/>

  <style>
    .t   { fill:#14140f; font-size:14px }
    .lbl { fill:#14140f; font-size:15px; font-weight:650 }
    .sm  { fill:#6b6b60; font-size:12.5px }
    .mono{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; fill:#14140f }
    .eye { fill:#6b6b60; font-size:11px; font-weight:700; letter-spacing:.09em }
    .box { fill:#fff; stroke:#dcdcd4; stroke-width:1.5; rx:10 }
    .num { fill:#fff; font-size:12px; font-weight:700 }
  </style>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a8a7c"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a2b2b"/>
    </marker>
    <marker id="ay" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c08a2b"/>
    </marker>
  </defs>

  <text x="34" y="40" class="lbl" font-size="21">Rescind — retractable agent memory</text>
  <text x="34" y="62" class="sm">Numbers are the order of operations. The red path is the retraction.</text>

  <!-- ================= AWS Bedrock ================= -->
  <rect x="34" y="92" width="300" height="132" class="box"/>
  <text x="50" y="116" class="eye">AWS BEDROCK</text>
  <text x="50" y="142" class="t">Titan <tspan class="mono">titan-embed-text-v2:0</tspan></text>
  <text x="50" y="160" class="sm">1024-d normalised embeddings</text>
  <text x="50" y="186" class="t">Claude — release / hold advice</text>
  <text x="50" y="204" class="sm">malformed response fails closed (holds)</text>

  <!-- ================= Agent ================= -->
  <rect x="34" y="256" width="300" height="216" class="box"/>
  <text x="50" y="280" class="eye">RESCIND AGENT</text>
  <text x="50" y="306" class="lbl">ask()</text>
  <text x="50" y="326" class="sm">embed → retrieve → threshold → reason</text>
  <text x="50" y="350" class="t" font-weight="650" fill="#8a2b2b">refuses below 2 supporting facts</text>
  <text x="50" y="368" class="sm">within L2 0.55 — decided before the</text>
  <text x="50" y="384" class="sm">model is ever called</text>
  <text x="50" y="414" class="lbl">retract()</text>
  <text x="50" y="434" class="sm">cascade + flag + audit, with 40001 retry</text>
  <text x="50" y="456" class="lbl">replay()</text>

  <!-- ================= Human ================= -->
  <rect x="34" y="504" width="300" height="104" class="box"/>
  <text x="50" y="528" class="eye">RECALL COORDINATOR (HUMAN)</text>
  <text x="50" y="554" class="t">“May we release LOT-2026-0619-NV?”</text>
  <text x="50" y="578" class="t" font-weight="650">works the review queue</text>
  <text x="50" y="596" class="sm">decisions are flagged, never auto-reversed</text>

  <!-- ================= CockroachDB ================= -->
  <rect x="470" y="92" width="516" height="516" fill="#fff" stroke="#c9c9be" stroke-width="2" rx="12"/>
  <text x="492" y="120" class="eye">COCKROACHDB v25.3 — THE MEMORY LAYER</text>

  <!-- facts -->
  <rect x="492" y="140" width="472" height="118" class="box"/>
  <text x="508" y="164" class="lbl">facts</text>
  <text x="508" y="186" class="mono">retracted BOOL AS (retracted_at IS NOT NULL) STORED</text>
  <text x="508" y="212" class="mono" fill="#8a2b2b">VECTOR INDEX (lot_id, retracted, embedding)</text>
  <text x="508" y="234" class="sm">prefix columns must be equality-constrained, so retrieval</text>
  <text x="508" y="250" class="sm">is forced to declare retracted = false → unreachable, not filtered</text>

  <!-- fact_edges -->
  <rect x="492" y="272" width="228" height="94" class="box"/>
  <text x="508" y="296" class="lbl">fact_edges</text>
  <text x="508" y="318" class="sm">parent → child lineage,</text>
  <text x="508" y="334" class="sm">real foreign keys</text>
  <text x="508" y="356" class="mono">WITH RECURSIVE</text>

  <!-- decisions -->
  <rect x="736" y="272" width="228" height="94" class="box"/>
  <text x="752" y="296" class="lbl">decisions</text>
  <text x="752" y="318" class="mono">decided_hlc</text>
  <text x="752" y="334" class="sm">cluster_logical_timestamp()</text>
  <text x="752" y="356" class="sm">+ needs_review flag</text>

  <!-- decision_support -->
  <rect x="492" y="380" width="228" height="80" class="box"/>
  <text x="508" y="404" class="lbl">decision_support</text>
  <text x="508" y="426" class="sm">the exact supporting set,</text>
  <text x="508" y="442" class="sm">with recall distances</text>

  <!-- retractions -->
  <rect x="736" y="380" width="228" height="80" class="box"/>
  <text x="752" y="404" class="lbl">retractions</text>
  <text x="752" y="426" class="sm">blast radius, actor, reason,</text>
  <text x="752" y="442" class="sm">written in the same txn</text>

  <!-- transaction band -->
  <rect x="492" y="476" width="472" height="52" fill="#f7ecec" stroke="#8a2b2b" stroke-width="1.5" rx="9"/>
  <text x="508" y="498" class="t" font-weight="650" fill="#8a2b2b">One serializable transaction</text>
  <text x="508" y="517" class="sm">cascade + flag + audit commit together or not at all</text>

  <!-- time travel band -->
  <rect x="492" y="540" width="472" height="52" fill="#eef3f7" stroke="#3f6b8a" stroke-width="1.5" rx="9"/>
  <text x="508" y="562" class="t" font-weight="650" fill="#2f5a78">AS OF SYSTEM TIME &lt;decided_hlc&gt;</text>
  <text x="508" y="581" class="sm">replays the identical MVCC snapshot the agent read — exact, not rebuilt</text>

  <!-- ================= Flows =================
       All agent-to-database arrows run horizontally through the corridor between
       the two columns and terminate on the CockroachDB boundary. Nothing crosses
       anything else; the numbered legend below carries the labels, which keeps
       the diagram readable instead of covering the boxes with text. -->

  <!-- 1 human asks the agent -->
  <line x1="184" y1="504" x2="184" y2="480" stroke="#8a8a7c" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="205" cy="492" r="11" fill="#6b6b60"/><text x="201" y="496" class="num">1</text>

  <!-- 2 agent calls Bedrock -->
  <line x1="184" y1="256" x2="184" y2="232" stroke="#8a8a7c" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="205" cy="244" r="11" fill="#6b6b60"/><text x="201" y="248" class="num">2</text>

  <!-- 3 retrieve over live memory -->
  <line x1="342" y1="300" x2="462" y2="300" stroke="#8a8a7c" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="402" cy="286" r="11" fill="#6b6b60"/><text x="398" y="290" class="num">3</text>

  <!-- 4 record decision + supporting set -->
  <line x1="342" y1="340" x2="462" y2="340" stroke="#8a8a7c" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="402" cy="326" r="11" fill="#6b6b60"/><text x="398" y="330" class="num">4</text>

  <!-- 5 the retraction cascade -->
  <line x1="342" y1="416" x2="462" y2="416" stroke="#8a2b2b" stroke-width="2.5" marker-end="url(#ar)"/>
  <circle cx="402" cy="402" r="11" fill="#8a2b2b"/><text x="398" y="406" class="num">5</text>

  <!-- 6 replay at the decision's HLC -->
  <line x1="342" y1="458" x2="462" y2="458" stroke="#3f6b8a" stroke-width="2.5" marker-end="url(#a)"/>
  <circle cx="402" cy="444" r="11" fill="#3f6b8a"/><text x="398" y="448" class="num">6</text>

  <!-- 7 flagged decisions surface to the human, they are never auto-reversed -->
  <line x1="462" y1="556" x2="344" y2="556" stroke="#c08a2b" stroke-width="2"
        stroke-dasharray="5 4" marker-end="url(#ay)"/>
  <circle cx="402" cy="536" r="11" fill="#c08a2b"/><text x="398" y="540" class="num">7</text>

  <text x="34" y="648" class="sm">1 coordinator asks · 2 Titan embeds, Claude advises · 3 vector recall over live memory only · 4 decision + support recorded with an HLC</text>
  <text x="34" y="668" class="sm">5 recall walks lineage and retracts the closure · 6 replay reads the original snapshot · 7 dependent decisions are flagged, never reversed</text>
  <text x="34" y="690" class="sm">Verified on every push against a real CockroachDB cluster — see ci/latest.json</text>
</svg>
